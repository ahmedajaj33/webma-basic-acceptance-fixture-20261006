<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebMa Basic Acceptance Fixture</title>
<style>body{font-family:system-ui,sans-serif;max-width:48rem;margin:4rem auto;padding:0 1rem;line-height:1.5}button{font:inherit;padding:.65rem 1rem}#status{margin-top:1rem}</style>

<body data-acceptance-version="v1">
<main>
<h1>Acceptance marker v1</h1>
<p>This is a disposable, non-secret fixture for WebMa-QP hosted Basic acceptance.</p>

<p id="status" aria-live="polite">Status: v1 ready</p>
</main>
<script>
document.getElementById('verify').addEventListener('click',()=>{document.getElementById('status').textContent='Status: v1 interaction verified';});
</script>
</body>
</html>
